[sqlfluff]
dialect = ansi
templater = jinja
max_line_length = 180

[sqlfluff:indentation]
tab_space_size = 2
indent_unit = space
# 打开隐式缩进, enable "hanging indent" style for WHERE, CASE
implicit_indents = allow

[sqlfluff:rules:capitalisation.keywords]
capitalisation_policy = lower
[sqlfluff:rules:capitalisation.identifiers]
extended_capitalisation_policy = lower
[sqlfluff:rules:capitalisation.functions]
extended_capitalisation_policy = lower
[sqlfluff:rules:capitalisation.literals]
capitalisation_policy = lower
[sqlfluff:rules:capitalisation.types]
extended_capitalisation_policy = lower

[sqlfluff:layout:type:data_type]
# 在每个 CREATE TABLE 内对齐列的数据类型
spacing_before = align
align_within = create_table_statement

[sqlfluff:layout:type:column_constraint_segment]
# 按约束在列定义中的出现顺序对齐, 不按约束语义分类
spacing_before = align
align_within = create_table_statement

[sqlfluff:layout:type:comment_clause]
# COMMENT ON 语句保持单行
spacing_within = single:inline

[sqlfluff:layout:type:from_expression]
# FROM 与首个表表达式保持同行, 不压平内部 JOIN 或子查询
spacing_before = single:inline

[sqlfluff:layout:type:alias_expression]
# 在别名关键字(AS)之前插入空格, 并且对齐所有同级别别名
spacing_before = align

# 在哪个语法块内部对齐, 这里只对 SELECT 子句内部做对齐
align_within = select_clause

# 从哪个范围内去寻找"同级别"元素：
# - bracketed: 对齐到最近的圆括号(常用)
# - statement: 对齐到整个 SQL 语句
# - file: 对齐到整个文件
align_scope = bracketed
